backend:
  name: github
  repo: premsnaps/premsnaps.github.io
  branch: main
  base_url: https://sveltia-cms-auth.premsnaps143.workers.dev

media_folder: images/uploads
public_folder: /images/uploads

collections:
  - name: pages
    label: Website Pages
    folder: content/pages
    create: true
    slug: "{{slug}}"
    format: yaml-frontmatter
    fields:
      - label: Title
        name: title
        widget: string

      - label: Content
        name: body
        widget: markdown
